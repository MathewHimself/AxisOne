<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AxisOne</title>
    <link rel="shortcut icon" href="Images/faviicon.svg" type="image/x-icon" />
    <link rel="stylesheet" href="Stylesheets/style.css?v=main-company-mobile-60-1" />
    <script defer src="JavaScripts/scripts.js"></script>
  </head>
  <body>
    <main class="main-page" data-node-id="559:480">
      <section class="hero" aria-label="AxisOne" data-node-id="664:416">
        <header class="top-panel" data-node-id="559:481">
          <a class="logo" href="mainPage.html" aria-label="AxisOne">
            <img src="Images/axisone-logo.svg" alt="AxisOne" />
          </a>

          <nav class="main-nav" aria-label="Основная навигация">
            <a class="main-nav__link main-nav__link--active" href="mainPage.html">продукт</a>
            <a class="main-nav__link" href="roadmap.html">роадмап</a>
            <a class="main-nav__button" href="prices.html">подписки</a>
          </nav>
        </header>

        <div class="hero__center" data-node-id="664:377">
          <div class="hero__brand" data-node-id="664:278">
            <div class="hero__brand-image" aria-hidden="true">
              <img class="hero__brand-image-art" src="Images/main-hero-symbol.svg" alt="" />
            </div>
            <h1 class="hero__title" data-node-id="559:482">Нейронка для стартапов</h1>
          </div>

          <div class="ask-block" data-node-id="664:239">
            <form class="ask-bar" data-node-id="559:486" action="#" method="get">
              <input
                class="ask-bar__input"
                data-node-id="559:487"
                type="text"
                name="question"
                placeholder="Спросить AxisOne"
                aria-label="Спросить AxisOne"
              />
              <button class="ask-bar__button" type="submit" aria-label="Создать запрос">
                <img src="Images/main-hero-plus.svg" alt="" aria-hidden="true" />
              </button>
            </form>
            <p class="hero__caption" data-node-id="559:489">
              Принимайте решения быстрее, без потери качества
            </p>
          </div>
        </div>

        <div class="hero-sticker hero-sticker--money" data-node-id="559:522" aria-hidden="true">
          <img class="hero-sticker__shape" src="Images/main-hero-sticker-shape.svg" alt="" />
          <img class="hero-sticker__money" src="Images/main-hero-money.svg" alt="" />
          <span>за деньги да</span>
        </div>

        <img
          class="hero-sticker hero-sticker--star"
          data-node-id="559:501"
          src="Images/main-hero-sticker-star.svg"
          alt=""
          aria-hidden="true"
        />

        <div class="hero-sticker hero-sticker--idea" data-node-id="559:499" aria-hidden="true">
          Та самая идея
        </div>

        <div class="hero-sticker hero-sticker--glow" data-node-id="559:497" aria-hidden="true">
          Glow up
        </div>

        <div class="hero-sticker hero-sticker--cloud" data-node-id="559:494" aria-hidden="true">
          <img src="Images/main-hero-cloud.svg" alt="" />
          <span>не витай в облаках</span>
        </div>
      </section>

      <section class="company-cases" aria-labelledby="company-cases-title" data-node-id="672:538">
        <div class="company-cases__info" data-node-id="672:539">
          <header class="company-cases__head" data-node-id="672:540">
            <h2 id="company-cases-title" class="company-cases__title" data-node-id="672:541">
              Компании, на которых была обучена модель
            </h2>
            <p class="company-cases__subtitle" data-node-id="672:542">
              Практики лидеров рынка, преобразованные в конкретные рекомендации
            </p>
          </header>

          <div class="company-cases__logos" data-node-id="672:543">
            <article class="company-logo-card" data-node-id="672:544">
              <img class="company-logo-card__image company-logo-card__image--apple" src="Images/main-cases-apple.png" alt="Apple" />
            </article>
            <article class="company-logo-card" data-node-id="672:546">
              <img class="company-logo-card__image company-logo-card__image--google" src="Images/main-cases-google.png" alt="Google" />
            </article>
            <article class="company-logo-card" data-node-id="672:548">
              <img class="company-logo-card__image company-logo-card__image--microsoft" src="Images/main-cases-microsoft.png" alt="Microsoft" />
            </article>
            <article class="company-logo-card" data-node-id="672:550">
              <img class="company-logo-card__image company-logo-card__image--amazon" src="Images/main-cases-amazon.png" alt="Amazon" />
            </article>
            <article class="company-logo-card" data-node-id="672:552">
              <img class="company-logo-card__image company-logo-card__image--nvidia" src="Images/main-cases-nvidia.png" alt="Nvidia" />
            </article>
            <article class="company-logo-card" data-node-id="672:554">
              <img class="company-logo-card__image company-logo-card__image--meta" src="Images/main-cases-meta.png" alt="Meta" />
            </article>
            <article class="company-logo-card" data-node-id="672:556">
              <img class="company-logo-card__image company-logo-card__image--mckinsey" src="Images/main-cases-mckinsey.png" alt="McKinsey" />
            </article>
            <article class="company-logo-card" data-node-id="672:558">
              <img class="company-logo-card__image company-logo-card__image--airbnb" src="Images/main-cases-airbnb.png" alt="Airbnb" />
            </article>
            <article class="company-logo-card" data-node-id="672:560">
              <img class="company-logo-card__image company-logo-card__image--uber" src="Images/main-cases-uber.png" alt="Uber" />
            </article>
            <article class="company-logo-card" data-node-id="672:562">
              <img class="company-logo-card__image company-logo-card__image--stripe" src="Images/main-cases-stripe.png" alt="Stripe" />
            </article>
          </div>
        </div>

        <a class="company-cases__button" href="companies.html" data-node-id="672:564">
          <span data-node-id="672:565">Все кейсы</span>
        </a>
      </section>
    </main>
  </body>
</html>
