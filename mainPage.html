<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AxisOne</title>
    <link rel="shortcut icon" href="Images/faviicon.svg" type="image/x-icon" />
    <link rel="stylesheet" href="Stylesheets/style.css" />
    <script defer src="JavaScripts/scripts.js"></script>
  </head>
  <body>
    <main class="main-page" data-node-id="456:229">
      <section class="hero" aria-label="AxisOne">
        <header class="top-panel" data-node-id="421:72">
          <a class="logo" href="mainPage.html" aria-label="AxisOne">
            <img src="Images/axisone-logo.svg" alt="AxisOne" />
          </a>

          <nav class="main-nav" aria-label="Основная навигация">
            <a
              class="main-nav__link main-nav__link--active"
              href="mainPage.html"
              >продукт</a
            >
            <a class="main-nav__link" href="roadmap.html">роадмап</a>
            <a class="main-nav__button" href="prices.html">подписки</a>
          </nav>
        </header>

        <div class="hero__center" data-node-id="456:232">
          <h1 class="hero__title" data-node-id="456:233">
            Инструмент для запуска стартапов
          </h1>

          <div class="ask-block" data-node-id="456:234">
            <form
              class="ask-bar"
              data-node-id="456:235"
              action="#"
              method="get"
            >
              <input
                class="ask-bar__input"
                data-node-id="456:236"
                type="text"
                name="question"
                placeholder="Спросить AxisOne"
                aria-label="Спросить AxisOne"
              />
              <button
                class="ask-bar__button"
                type="submit"
                aria-label="Создать запрос"
              >
                <img src="Images/plus-icon.svg" alt="" aria-hidden="true" />
              </button>
            </form>

            <div
              class="prompt-chips"
              data-node-id="456:238"
              aria-label="Быстрые запросы"
            >
              <button class="prompt-chip" type="button">Стратегия роста</button>
              <button class="prompt-chip" type="button">Анализ бизнеса</button>
              <button class="prompt-chip" type="button">
                Поиск возможностей
              </button>
              <button class="prompt-chip" type="button">Решения CEO</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
